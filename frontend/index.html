<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnySearch Frontend</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="eyebrow">AnySearch</p>
        <h1>Search by topic</h1>

        <form id="search-form" class="search-form">
          <label class="sr-only" for="topic">Queries</label>
          <textarea
            id="topic"
            name="topic"
            rows="6"
            placeholder="Enter one query per line, or paste a JSON array like: [{"query":"AI for enterprise sales"}]"
            required
          ></textarea>
          <button type="submit">Get response</button>
        </form>

        <div id="status" class="status" aria-live="polite"></div>

        <section id="results" class="results" aria-live="polite"></section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
